server:
  port: 8080
spring:
  application:
    name: exercise
  profiles:
    active: "${SPRING_PROFILES_ACTIVE:dev}"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
info:
  app:
    name: Spring Boot Exercise Application
    description: Homework Tasks for Spring Boot CRUD & Security
    version: 1.0.0
