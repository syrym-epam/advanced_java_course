spring:
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/product-db}"
    username: "${SPRING_DATASOURCE_USER:postgres}"
    password: "${SPRING_DATASOURCE_PASS:postgres}"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    
jwt:
  secret-key: mySecretKeyForTestingJwtAuthenticationWithAtLeast256BitsLengthHere!
  expiration: 3600000
app:
  security:
    users:
      - username: ${PROD_ADMIN_USER}
        password: ${PROD_ADMIN_PASSWORD} 
        roles: [ADMIN, USER]
      - username: ${PROD_STANDARD_USER}
        password: ${PROD_STANDARD_USER_PASSWORD}
        roles: [USER]