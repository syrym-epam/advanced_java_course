spring:
  datasource:
    url: jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
jwt:
  expiration: 3600000
  secret-key: Ihwjq!BJK3HBjk#21763fg1khbjlbnsdls2hbvekj12kjhbkxlsasa!
app:
  security:
    users:
      - username: admin
        password: password
        roles: [ADMIN, USER]
      - username: user
        password: password
        roles: [USER]