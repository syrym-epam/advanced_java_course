services:
  product-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB_PRODUCT}
      POSTGRES_USER:  ${POSTGRES_USER}
      POSTGRES_PASSWORD:  ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432" 
    # volumes:
      # - ./init-scripts/poduct-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_PRODUCT}"]
      interval: 5s
      timeout: 5s
      retries: 5   
  product-service:
    build:
      context: ./product-service/
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_DATASOURCE_URL=${PRODUCT_SERVICE_DATASOURCE_URL}      
      - SPRING_DATASOURCE_USER=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASS=${POSTGRES_PASSWORD}
      - PROD_ADMIN_USER=${PROD_ADMIN_USER}
      - PROD_ADMIN_PASSWORD=${PROD_ADMIN_PASSWORD}
      - PROD_STANDARD_USER=${PROD_STANDARD_USER}
      - PROD_STANDARD_USER_PASSWORD=${PROD_STANDARD_USER_PASSWORD}
      - KAFKA_SERVICE_URL=${KAFKA_SERVICE_URL}
      - SCHEMA_REGISTRY_URL=${SCHEMA_REGISTRY_URL}   
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'; echo $?"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      product-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
  resource-service:
    build:
      context: ./resource-service
      dockerfile: Dockerfile
    environment:
      - KAFKA_SERVICE_URL=${KAFKA_SERVICE_URL}
      - SCHEMA_REGISTRY_URL=${SCHEMA_REGISTRY_URL}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health/readiness | grep -q '\"status\":\"UP\"'; echo $?"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      kafka:
        condition: service_healthy
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'Mk3OEYBSD3TsfwbfRM1234=='
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: schema-registry
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: 'http://0.0.0.0:8081'
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:8081/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s